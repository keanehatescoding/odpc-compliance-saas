# Lints, typechecks, tests and builds every pull request and every push to
# master. The tests run against PGlite, so no Postgres service is needed.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to a pull request cancels the run for the one before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        # Nothing here pushes, so don't leave the token where npm's install
        # scripts could read it. gitleaks scans a commit range, so keep history.
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
